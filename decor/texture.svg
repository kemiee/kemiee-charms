<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="textureTitle">
  <title id="textureTitle">Subtle background texture</title>
  <defs>
    <pattern id="dots" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#d9b59a" fill-opacity="0.18" />
    </pattern>
  </defs>
  <rect width="300" height="300" fill="url(#dots)" />
</svg>
